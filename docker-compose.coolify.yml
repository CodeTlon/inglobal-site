# Sitio + Postgres + cron de agenda, todo en un solo despliegue de Coolify
# ("Docker Compose" como tipo de recurso, apuntando a este archivo).
#
# Variables que se cargan en Coolify (Environment Variables del recurso):
#   Obligatorias : BETTER_AUTH_SECRET            (openssl rand -base64 32; distinto por entorno)
#   Opcionales   : RESEND_API_KEY, RESEND_FROM_EMAIL, RESEND_FROM_NAME, COMPANY_EMAIL
#                  NEXT_PUBLIC_SITE_URL, NEXT_PUBLIC_GA_ID   (entran en el build)
#                  BACKUP_PATH (solo para el perfil `migracion`: ruta absoluta del backup de prod)
#                  TRANSCODE_SERVICE_URL, TRANSCODE_API_KEY  (servicio global de video)
# La contraseña de Postgres y el CRON_SECRET los genera Coolify (variables mágicas SERVICE_PASSWORD_*).
# El dominio se asigna en la pestaña del recurso: `app` (puerto 3000). Los archivos subidos viven en el
# volumen `storage` y los sirve la propia app en /media (igual que gc2-entrenamiento): sin MinIO.
#
# Datos de producción: ver `.ai/context/MIGRACION_SUPABASE.md` (perfil `migracion` de este compose).

services:
  app:
    build:
      context: .
      args:
        # Entra a la CSP y a images.remotePatterns en el build.
        STORAGE_PUBLIC_URL: ${SERVICE_URL_APP}/media
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SERVICE_FQDN_APP_3000
      - NODE_ENV=production
      - DATABASE_URL=postgres://inglobal:${SERVICE_PASSWORD_POSTGRES}@db:5432/inglobal
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?Definí BETTER_AUTH_SECRET en las variables del recurso}
      - BETTER_AUTH_URL=${SERVICE_URL_APP}
      - STORAGE_DIR=/data/storage
      - STORAGE_PUBLIC_URL=${SERVICE_URL_APP}/media
      - CRON_SECRET=${SERVICE_PASSWORD_CRON}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-onboarding@resend.dev}
      - RESEND_FROM_NAME=${RESEND_FROM_NAME:-Grúas InGlobal}
      - COMPANY_EMAIL=${COMPANY_EMAIL:-cotizacionesinglobalsrl@gmail.com}
      # Servicio global de compresión de video (opcional; sin él se guarda el video original).
      - TRANSCODE_SERVICE_URL=${TRANSCODE_SERVICE_URL:-}
      - TRANSCODE_API_KEY=${TRANSCODE_API_KEY:-}
    volumes:
      - storage:/data/storage
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      - POSTGRES_USER=inglobal
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=inglobal
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U inglobal -d inglobal']
      interval: 5s
      timeout: 3s
      retries: 20

  # Reemplaza a los workflows de GitHub Actions: pega a los crons de la app por la red interna.
  cron:
    image: ${CRON_IMAGE:-alpine:3.20}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      - CRON_SECRET=${SERVICE_PASSWORD_CRON}
    command:
      - sh
      - -c
      - |
        while true; do
          for path in transicionar-estados notificar; do
            wget -qO- --header="Authorization: Bearer $$CRON_SECRET" "http://app:3000/api/agenda/cron/$$path" >/dev/null 2>&1 \
              || echo "[cron] $$path falló"
          done
          sleep 900
        done

  # Solo bajo demanda: docker compose --profile migracion run --rm import
  # Carga el backup de producción (monta ./backup) y deja la base idéntica. Ver MIGRACION_SUPABASE.md.
  import:
    profiles: ['migracion']
    build:
      context: .
      target: tools
    depends_on:
      app:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://inglobal:${SERVICE_PASSWORD_POSTGRES}@db:5432/inglobal
      - BACKUP_DIR=/backup
      - STORAGE_DIR=/data/storage
      - STORAGE_PUBLIC_URL=${SERVICE_URL_APP}/media
      - HOME=/tmp
    volumes:
      # Ruta del backup en el servidor (por defecto ./backup junto al compose). BACKUP_PATH=/root/backup-inglobal
      - ${BACKUP_PATH:-./backup}:/backup:ro
      - storage:/data/storage

volumes:
  pgdata:
  storage:
