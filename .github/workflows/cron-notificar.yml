name: Cron - notificaciones push de agenda

# Recordatorio de mañana (desde las 19:00 Córdoba) y reservas por vencer. El endpoint es
# idempotente (clave por aviso en notificaciones_enviadas), así que un retraso o un doble
# disparo de GitHub Actions no duplica avisos. Mismo CRON_SECRET que cron-transicionar-estados.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de notificaciones
        run: |
          curl -sf -X GET "https://inglobal-site-theta.vercel.app/api/agenda/cron/notificar" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
